# Runs the pipeline Monday and Tuesday mornings, after the ingestion Lambda has
# landed new files: Monday picks up Sunday's games, Tuesday picks up Monday night's.
# Then renders the 2026 charts from the refreshed gold tables onto the run page,
# and the success email links straight to it.
resources:
  jobs:
    nfl_weekly:
      name: nfl-weekly

      # Standard serverless mode: fewer DBUs, 4-6 minute startup. Fine for a scheduled batch.
      performance_target: STANDARD

      schedule:
        # Quartz fields: sec min hour day-of-month month day-of-week.
        # 07:00 Central, Mon and Tue; the Lambda runs at 06:15.
        quartz_cron_expression: "0 0 7 ? * MON,TUE"
        timezone_id: America/Chicago
        pause_status: UNPAUSED

      # Sent by Databricks itself, so they work even though the job's own
      # compute has no internet access. The success email links to the run,
      # where the charts are.
      email_notifications:
        on_success:
          - ${workspace.current_user.userName}
        on_failure:
          - ${workspace.current_user.userName}

      tasks:
        - task_key: refresh_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.nfl_pipeline.id}

        # Renders the charts from gold and shows them on the run page. Runs only
        # if the refresh succeeds, so the charts always show that morning's data.
        # A notebook, not a script, because only notebook output shows images.
        # Serverless notebooks already have matplotlib, pandas and pillow.
        - task_key: charts
          depends_on:
            - task_key: refresh_pipeline
          notebook_task:
            notebook_path: ../charts/weekly_charts.py
