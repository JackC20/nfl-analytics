<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1032 322" width="1032" height="322" role="img" aria-label="fact_play feeds two chains: agg_player_game then agg_player_season and its QB, RB and WR/TE views; and agg_team_game then agg_team_season." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
  .bg { fill: #ffffff; stroke: #d7ddd8; }
  .ent .body { fill: #ffffff; stroke-width: 1.5; }
  .ent.dim .body { stroke: #2c6a47; } .ent.dim .hdr, .ent.dim .hdr-fill { fill: #dcebe1; }
  .ent.fact .body { stroke: #96690c; } .ent.fact .hdr, .ent.fact .hdr-fill { fill: #f3e8cc; }
  .ent.agg .body { stroke: #39598c; } .ent.agg .hdr, .ent.agg .hdr-fill { fill: #dfe6f2; }
  .hdr-fill { opacity: .55; }
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .t-name { font-size: 14px; font-weight: 700; fill: #17211c; }
  .t-name.sm { font-size: 13px; } .t-name.xs { font-size: 10.5px; }
  .t-grain, .t-note { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #48544d; }
  .t-note { fill: #75817a; } .t-grain.xs { font-size: 10.5px; }
  .t-flag { font-size: 11px; font-weight: 700; fill: #96690c; }
  .t-col { font-size: 11px; fill: #48544d; }
  .t-col.more { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-style: italic; fill: #75817a; }
  .t-col.flag { fill: #96690c; font-weight: 700; }
  .t-key { font-size: 9.5px; font-weight: 700; letter-spacing: .06em; fill: #75817a; }
  .rowrule { stroke: #d7ddd8; stroke-width: 1; }
  .rel { stroke: #8c978f; stroke-width: 1.4; fill: none; }
  .flow { stroke: #8c978f; stroke-width: 1.6; fill: none; }
  .arrowhead { fill: #8c978f; }
  .t-rel { font-size: 11px; font-weight: 600; fill: #48544d; }
</style><rect class="bg" x="0.5" y="0.5" width="1031" height="321" rx="8"/><g transform="translate(16,16)"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs><path class="flow" d="M810,68 C840,68 822,23 852,23" marker-end="url(#arr)"/>
<path class="flow" d="M810,68 C840,68 822,65 852,65" marker-end="url(#arr)"/>
<path class="flow" d="M810,68 C840,68 822,107 852,107" marker-end="url(#arr)"/>
<text class="t-rel" x="831.0" y="152" text-anchor="middle">filtered</text>
<text class="t-rel" x="831.0" y="166" text-anchor="middle">views</text>
<line class="flow" x1="190" y1="68" x2="300" y2="68" marker-end="url(#arr)"/>
<text class="t-rel" x="245.0" y="61" text-anchor="middle">player × game</text>
<line class="flow" x1="520" y1="68" x2="600" y2="68" marker-end="url(#arr)"/>
<text class="t-rel" x="560.0" y="61" text-anchor="middle">by season</text>
<line class="flow" x1="190" y1="232" x2="300" y2="232" marker-end="url(#arr)"/>
<text class="t-rel" x="245.0" y="225" text-anchor="middle">team × game</text>
<line class="flow" x1="520" y1="232" x2="600" y2="232" marker-end="url(#arr)"/>
<text class="t-rel" x="560.0" y="225" text-anchor="middle">by season</text>
<g class="ent fact">
<rect class="body" x="20" y="24" width="170" height="252" rx="4"/>
<rect class="hdr-fill" x="20" y="24" width="170" height="252" rx="4"/>
<text class="t-name sm" x="32" y="44">fact_play</text>
<text class="t-grain" x="32" y="62">grain: game_id + play_id</text>
<text class="t-note" x="32" y="78"></text>
<text class="t-note" x="32" y="94">Shared definitions:</text>
<text class="t-flag" x="32" y="110">is_scrimmage_play</text>
<text class="t-flag" x="32" y="126">is_explosive</text>
<text class="t-note" x="32" y="142"></text>
<text class="t-note" x="32" y="158">Every aggregate</text>
<text class="t-note" x="32" y="174">counts plays by these</text>
</g>
<g class="ent agg">
<rect class="body" x="300" y="24" width="220" height="88" rx="4"/>
<rect class="hdr-fill" x="300" y="24" width="220" height="88" rx="4"/>
<text class="t-name sm" x="312" y="44">agg_player_game</text>
<text class="t-grain" x="312" y="62">grain: game_id + player_id</text>
<text class="t-note" x="312" y="78">passer, rusher and receiver</text>
<text class="t-note" x="312" y="94">credits summed per game</text>
</g>
<g class="ent agg">
<rect class="body" x="600" y="24" width="210" height="88" rx="4"/>
<rect class="hdr-fill" x="600" y="24" width="210" height="88" rx="4"/>
<text class="t-name sm" x="612" y="44">agg_player_season</text>
<text class="t-grain" x="612" y="62">grain: season + player_id</text>
<text class="t-note" x="612" y="78">sums game totals, then</text>
<text class="t-note" x="612" y="94">recomputes every rate</text>
</g>
<g class="ent agg"><rect class="body" x="852" y="6" width="138" height="34" rx="4"/><rect class="hdr-fill" x="852" y="6" width="138" height="34" rx="4"/><text class="t-name xs" x="862" y="21">agg_qb_season</text><text class="t-grain xs" x="862" y="34">position_group: QB</text></g>
<g class="ent agg"><rect class="body" x="852" y="48" width="138" height="34" rx="4"/><rect class="hdr-fill" x="852" y="48" width="138" height="34" rx="4"/><text class="t-name xs" x="862" y="63">agg_rb_season</text><text class="t-grain xs" x="862" y="76">position_group: RB</text></g>
<g class="ent agg"><rect class="body" x="852" y="90" width="138" height="34" rx="4"/><rect class="hdr-fill" x="852" y="90" width="138" height="34" rx="4"/><text class="t-name xs" x="862" y="105">agg_wr_te_season</text><text class="t-grain xs" x="862" y="118">position_group: WR, TE</text></g>
<g class="ent agg">
<rect class="body" x="300" y="188" width="220" height="88" rx="4"/>
<rect class="hdr-fill" x="300" y="188" width="220" height="88" rx="4"/>
<text class="t-name sm" x="312" y="208">agg_team_game</text>
<text class="t-grain" x="312" y="226">grain: game_id + team_id</text>
<text class="t-note" x="312" y="242">each play counted for offense</text>
<text class="t-note" x="312" y="258">(off_) and defense (def_)</text>
</g>
<g class="ent agg">
<rect class="body" x="600" y="188" width="210" height="88" rx="4"/>
<rect class="hdr-fill" x="600" y="188" width="210" height="88" rx="4"/>
<text class="t-name sm" x="612" y="208">agg_team_season</text>
<text class="t-grain" x="612" y="226">grain: season + team_id</text>
<text class="t-note" x="612" y="242">sums game totals, then</text>
<text class="t-note" x="612" y="258">recomputes every rate</text>
</g></g></svg>
