version: 0.2

# Build instructions for AWS CodeBuild. CodeBuild runs this in AWS, builds the
# container from ingestion/Dockerfile, pushes it to ECR, and points the Lambda
# at the new image. Nothing runs on a developer machine.
#
# Project environment variables to set on the CodeBuild project:
#   REGISTRY         043309367189.dkr.ecr.us-east-1.amazonaws.com
#   ECR_REPOSITORY   nfl-analytics-ingestion
#   FUNCTION_NAME    nfl-analytics-ingestion
#
# The project must have "Privileged" enabled, or docker build cannot run.

phases:
  pre_build:
    commands:
      # Tag with the commit sha so each build is a distinct image URI. Lambda
      # pins an image by digest, so reusing :latest would leave the function on
      # the old image even after a successful push.
      - IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:${CODEBUILD_RESOLVED_SOURCE_VERSION:-manual}"
      - echo "Building $IMAGE_URI"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"

  build:
    commands:
      - docker build --platform linux/amd64 -t "$IMAGE_URI" ingestion

  post_build:
    commands:
      - docker push "$IMAGE_URI"
      # Expected to fail on the first build, before the function exists. Create
      # the Lambda from the image this build pushed, then every later build
      # updates it in place.
      - |
        aws lambda update-function-code \
          --function-name "$FUNCTION_NAME" \
          --image-uri "$IMAGE_URI" \
        || echo "Lambda $FUNCTION_NAME not found — create it from $IMAGE_URI"
      - echo "Image pushed: $IMAGE_URI"
